name: Build Windows Installer

# Builds the standalone Windows installer (NSIS .exe) and keeps it as a
# downloadable artifact of the run. Nothing is published: no GitHub Release,
# no GH_TOKEN needed.
#
# Start it from the Actions tab ("Run workflow"). GitHub only shows that
# button for workflows present on the default branch.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # --publish never: build only, never upload to GitHub Releases
      - name: Build Windows installer
        run: npm run electron:build:win -- --publish never

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Afus-Hanout-Setup-${{ steps.version.outputs.version }}-win
          path: release/Afus Hanout Setup *.exe
          if-no-files-found: error
          retention-days: 90
