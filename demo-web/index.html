<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>أفوس حانوت — تجربة</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <style>
      #demo-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif;z-index:9999}
      #demo-loading .t{font-size:22px;font-weight:700}
      #demo-loading .s{opacity:.7;font-size:14px}
      #demo-loading .bar{width:min(320px,70vw);height:6px;background:#26262b;border-radius:99px;overflow:hidden}
      #demo-loading-bar{height:100%;width:5%;background:#6366f1;transition:width .3s}
    </style>
  </head>
  <body>
    <div id="demo-loading"><div class="t">أفوس حانوت · Afus Hanout</div><div class="s">نحضّر الحانوت التجريبي… Préparation de l’épicerie de démo…</div><div class="bar"><div id="demo-loading-bar"></div></div></div>
    <div id="root"></div>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
